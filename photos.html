<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photos For Mommy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-glow glow-left"></div>
    <div class="page-glow glow-right"></div>
    <div class="petals" aria-hidden="true"></div>

    <main class="shell gallery-shell">
      <section class="gallery-hero reveal">
        <p class="eyebrow">Photo Memories</p>
        <h1>We love you mommy, best mom in the world.</h1>
        <p class="lede">
          Every photo carries a memory, and every memory reminds us how much
          love you have given our family.
        </p>
        <a class="gallery-link" href="index.html">Back to the main page</a>
      </section>

      <section class="photo-gallery reveal">
        <div class="photo-grid" id="photo-grid"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
